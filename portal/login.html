<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Paws in Stride</title>

    <link rel="stylesheet" href="portal.css">
</head>

<body>

    <main class="login-container">

        <h1>Paws in Stride</h1>
        <h2>Portal Login</h2>

        <form id="login-form">

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                autocomplete="current-password"
                required
            >

            <button type="submit">
                Sign In
            </button>

        </form>

        <p id="login-message"></p>

    </main>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Portal -->
    <script src="portal.js?v=20260907-admin-routing-1"></script>

</body>
</html>
