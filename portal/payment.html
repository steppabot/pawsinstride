<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Secure Checkout | Paws in Stride
    </title>

    <link
        rel="stylesheet"
        href="./portal.css"
    >
</head>

<body>

    <main
        style="
            max-width: 720px;
            margin: 0 auto;
            padding: 40px 20px;
        "
    >

        <!-- ========================================
             PAYMENT HEADER
             ======================================== -->

        <section
            style="
                text-align: center;
                margin-bottom: 30px;
            "
        >

            <h1>
                Secure Checkout
            </h1>

            <p>
                Complete your payment to confirm your pet care services.
            </p>

        </section>


        <!-- ========================================
             ORDER SUMMARY
             ======================================== -->

        <section
            id="payment-summary"
            style="
                background: white;
                border-radius: 16px;
                padding: 24px;
                margin-bottom: 24px;
            "
        >

            <h2>
                Order Summary
            </h2>

            <div
                id="payment-summary-content"
            >
                Loading your booking...
            </div>

        </section>


        <!-- ========================================
             PAYMENT METHODS
             ======================================== -->

        <section
            id="payment-methods"
            style="
                background: white;
                border-radius: 16px;
                padding: 24px;
            "
        >

            <h2>
                Choose Payment Method
            </h2>


            <!-- ========================================
                 PAYPAL
                 ======================================== -->
            
            <div
                id="paypal-payment-wrapper"
                hidden
            >
            
                <paypal-button
                    id="paypal-button"
                    type="pay"
                    hidden
                ></paypal-button>
            
            </div>


            <!-- ========================================
                 VENMO
                 ======================================== -->

            <div
                id="venmo-payment-wrapper"
                hidden
                style="
                    margin-top: 12px;
                "
            >

                <venmo-button
                    id="venmo-button"
                    type="pay"
                ></venmo-button>

            </div>


            <!-- ========================================
                 CREDIT / DEBIT CARD
                 ======================================== -->
            
            <div
                id="card-payment-wrapper"
                hidden
                style="
                    margin-top: 20px;
                    padding-top: 20px;
                    border-top: 1px solid #e5e5e5;
                "
            >
            
                <h3
                    style="
                        margin-top: 0;
                        margin-bottom: 16px;
                    "
                >
                    Credit or Debit Card
                </h3>
            
            
                <!-- ========================================
                     CARD NUMBER
                     ======================================== -->
            
                <div
                    id="paypal-card-fields-number"
                    style="
                        height: 52px;
                        border: 1px solid #cccccc;
                        border-radius: 8px;
                        margin-bottom: 12px;
                        overflow: hidden;
                        background: white;
                    "
                ></div>
            
            
                <!-- ========================================
                     EXPIRATION + CVV
                     ======================================== -->
            
                <div
                    style="
                        display: grid;
                        grid-template-columns: 1fr 1fr;
                        gap: 12px;
                        margin-bottom: 16px;
                    "
                >
            
                    <div
                        id="paypal-card-fields-expiry"
                        style="
                            height: 52px;
                            border: 1px solid #cccccc;
                            border-radius: 8px;
                            overflow: hidden;
                            background: white;
                        "
                    ></div>
            
            
                    <div
                        id="paypal-card-fields-cvv"
                        style="
                            height: 52px;
                            border: 1px solid #cccccc;
                            border-radius: 8px;
                            overflow: hidden;
                            background: white;
                        "
                    ></div>
            
                </div>
            
            
                <!-- ========================================
                     CARD PAY BUTTON
                     ======================================== -->
            
                <button
                    id="card-pay-button"
                    type="button"
                    style="
                        width: 100%;
                        min-height: 50px;
                        border: 0;
                        border-radius: 8px;
                        font-size: 17px;
                        font-weight: 700;
                        cursor: pointer;
                    "
                >
                    Pay with Card
                </button>
            
            </div>
            
            
            <!-- ========================================
                 PAYMENT STATUS
                 ======================================== -->
            
            <div
                id="payment-message"
                style="
                    margin-top: 16px;
                    text-align: center;
                "
            ></div>

        </section>

    </main>


    <!-- ========================================
         SUPABASE
         ======================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- ========================================
         PAYMENT LOGIC
         ======================================== -->

    <script
        src="./payment.js"
    ></script>


    <!-- ========================================
         PAYPAL WEB SDK V6 - SANDBOX
         ======================================== -->

    <script
        async
        src="https://www.sandbox.paypal.com/web-sdk/v6/core"
        onload="onPayPalWebSdkLoaded()"
    ></script>

</body>
</html>
