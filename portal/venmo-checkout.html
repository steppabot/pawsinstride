<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Venmo Checkout | Paws in Stride</title><link rel="stylesheet" href="./portal.css"><style>[hidden]{display:none!important}</style></head>
<body class="client-portal-page payment-page"><main class="payment-page-container">
<header class="payment-page-header"><div class="payment-header-brand"><img class="payment-header-logo" src="./assets/paws-in-stride-logo.png" alt="Paws in Stride"><div class="payment-header-copy"><span class="payment-eyebrow">SECURE CHECKOUT</span><h1>Pay with Venmo</h1></div></div></header>
<div class="payment-layout"><section class="payment-card"><div class="payment-card-heading"><h2 id="venmo-heading">Your booking</h2></div><p>Paws in Stride pet care services</p><p id="venmo-credit"></p><div class="payment-summary-total"><span>Amount to pay</span><strong id="venmo-total">—</strong></div><p id="venmo-message" role="status" aria-live="polite">Loading your checkout…</p><div class="payment-wallet-wrapper"><venmo-button id="venmo-button" type="pay" hidden></venmo-button></div><button id="venmo-check" class="payment-complete-credit-button" hidden>Check payment status</button><a id="venmo-return" class="booking-success-button" hidden>Return to Paws in Stride</a></section></div>
</main><script src="./venmo-checkout.js"></script></body></html>
