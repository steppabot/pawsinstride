<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Client Dashboard | Paws in Stride
  </title>

  <link
    rel="stylesheet"
    href="portal.css"
  >
</head>


<body>

  <main class="dashboard-container">

    <div class="dashboard-header">

      <div>

        <h1>
          Paws in Stride
        </h1>

        <h2 id="welcome-name"></h2>

      </div>

      <button
        id="request-walk-button"
        class="primary-button"
      >
        + Request a Walk
      </button>

    </div>


    <div id="loading">
      Loading your account...
    </div>


    <div
      id="dashboard-content"
      style="display:none;"
    >

      <section
        id="booking-section"
        class="booking-section"
        style="display:none;"
      >

        <div class="section-header">

          <h3>
            Request Walks
          </h3>

          <button
            type="button"
            id="close-booking-button"
            class="close-button"
            aria-label="Close booking form"
          >
            ×
          </button>

        </div>


        <form id="booking-form">

          <label for="booking-pet">
            Pet
          </label>

          <select
            id="booking-pet"
            required
          >
            <option value="">
              Select your pet
            </option>
          </select>


          <label for="booking-service">
            Service
          </label>

          <select
            id="booking-service"
            required
          >

            <option value="">
              Select a service
            </option>

            <option
              value="15 Minute Walk"
              data-price="30"
            >
              15 Minute Walk — $30
            </option>

            <option
              value="30 Minute Walk"
              data-price="50"
            >
              30 Minute Walk — $50
            </option>

            <option
              value="60 Minute Walk"
              data-price="75"
            >
              60 Minute Walk — $75
            </option>

          </select>


          <label for="booking-time">
            Preferred Time Window
          </label>

          <select
            id="booking-time"
            required
          >

            <option value="">
              Select a time window
            </option>

            <option value="7:00 AM - 10:00 AM">
              7:00 AM – 10:00 AM
            </option>

            <option value="10:00 AM - 12:00 PM">
              10:00 AM – 12:00 PM
            </option>

            <option value="12:00 PM - 2:00 PM">
              12:00 PM – 2:00 PM
            </option>

            <option value="2:00 PM - 4:00 PM">
              2:00 PM – 4:00 PM
            </option>

            <option value="4:00 PM - 6:00 PM">
              4:00 PM – 6:00 PM
            </option>

            <option value="6:00 PM - 8:00 PM">
              6:00 PM – 8:00 PM
            </option>

            <option value="8:00 PM - 10:00 PM">
              8:00 PM – 10:00 PM
            </option>

          </select>


          <!-- DATES -->

          <label>
            Dates
          </label>

          <p class="booking-help">
            Select at least 3 walk dates per week.
            Tap a date to select it. Tap it again to remove it.
          </p>


          <!-- INLINE CALENDAR -->

          <div class="booking-calendar">

            <div class="calendar-header">

              <button
                type="button"
                id="calendar-prev"
                class="calendar-nav-button"
                aria-label="Previous month"
              >
                ‹
              </button>

              <strong id="calendar-month-label">
              </strong>

              <button
                type="button"
                id="calendar-next"
                class="calendar-nav-button"
                aria-label="Next month"
              >
                ›
              </button>

            </div>


            <div class="calendar-weekdays">

              <span>Mon</span>
              <span>Tue</span>
              <span>Wed</span>
              <span>Thu</span>
              <span>Fri</span>
              <span>Sat</span>
              <span>Sun</span>

            </div>


            <div
              id="booking-calendar-grid"
              class="calendar-grid"
            >
            </div>

          </div>


          <!-- SELECTED DATES -->

          <div id="selected-dates-container">

            <div class="selected-dates-header">

              <strong>
                Selected Dates
              </strong>

              <span id="selected-date-count">
                0 walks
              </span>

            </div>


            <div id="selected-dates-list">

              <p class="empty-dates-message">
                No dates selected yet.
              </p>

            </div>

          </div>


          <!-- TOTAL -->

          <div class="booking-total">

            <div>
              <span id="booking-count">
                0 walks
              </span>
            </div>

            <div>
              <strong id="booking-price">
                $0.00
              </strong>
            </div>

          </div>


          <button
            type="submit"
            id="booking-submit-button"
            class="primary-button"
          >
            Continue
          </button>


          <p id="booking-message"></p>

        </form>

      </section>


      <section>

        <h3>
          Your Pet
        </h3>

        <div id="pet-info"></div>

      </section>


      <section>

        <h3>
          Upcoming Walks
        </h3>

        <div id="upcoming-visits"></div>

      </section>


      <button id="logout-button">
        Log Out
      </button>

    </div>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="./portal.js"></script>

</body>

</html>
