<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Paws in Stride</title>


    <!-- ========================================
         INSTALLED PWA — EDGE-TO-EDGE VIEWPORT
    ======================================== -->

    <script>

        (() => {

            const isInstalledPWA =
                window.matchMedia(
                    "(display-mode: standalone)"
                ).matches ||
                window.navigator.standalone === true;

            if (!isInstalledPWA) {
                return;
            }

            const viewport =
                document.querySelector(
                    'meta[name="viewport"]'
                );

            if (!viewport) {
                return;
            }

            const currentContent =
                viewport.getAttribute("content") || "";

            const viewportSettings =
                currentContent
                    .split(",")
                    .map(setting => setting.trim())
                    .filter(
                        setting =>
                            setting &&
                            !/^viewport-fit\s*=/i.test(setting)
                    );

            viewportSettings.push(
                "viewport-fit=cover"
            );

            viewport.setAttribute(
                "content",
                viewportSettings.join(", ")
            );

        })();

    </script>

    <!-- ========================================
         PWA / HOME SCREEN APP
    ======================================== -->

    <link
        rel="manifest"
        href="/portal/manifest.webmanifest"
    >

    <meta
        name="theme-color"
        content="#2890df"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >
    
    <meta
        name="apple-mobile-web-app-title"
        content="Paws in Stride"

         FAVICONS
    ======================================== -->
    
    <link

        sizes="180x180"

    >
    
    <link

    >
    
    <link

        sizes="16x16"

    >
    
    <link
        rel="icon"

    >
    
    <link

        href="/icons/favicon.ico"
    >

    <!-- ========================================
         LAUNCH SCREEN
    ======================================== -->

    <style>

        html,
        body {

            margin: 0;
            width: 100%;
            min-height: 100%;

            background: #f5ab40;

            font-family: Arial, sans-serif;

        }


        body {

            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            align-items: center;
            justify-content: center;

        }


        /* ========================================
           STATIC LAUNCHER — HIDDEN BY DEFAULT
        ======================================== */

        .app-launcher {

            display: none;

            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 18px;

            width: 100%;
            padding: 24px;

            text-align: center;
            box-sizing: border-box;

        }


        /* ========================================
           APP LOGO
        ======================================== */

        .app-launcher img {

            width: min(300px, 72vw);
            height: auto;

            display: block;

        }


        /* ========================================
           STATIC LOADING INDICATOR
        ======================================== */

        .app-launcher-spinner {

            width: 30px;
            height: 30px;

            border: 4px solid rgba(
                255,
                255,
                255,
                0.35
            );

            border-top-color: #ffffff;
            border-radius: 50%;

        }


        /* ========================================
           LOADING STATUS
        ======================================== */

        .app-launcher-status {

            margin: 0;

            font-size: 16px;
            font-weight: 700;

            color: #ffffff;

        }


        /* ========================================
           REDUCE MOTION — SHOW STATIC LAUNCHER
        ======================================== */

        @media (prefers-reduced-motion: reduce) {

            .app-launcher {

                display: flex;

            }

        }

    </style>

</head>


<body>

    <!-- ========================================
         PWA LAUNCH SCREEN
    ======================================== -->

    <main class="app-launcher">

        <img
            src="/portal/assets/pwa-icon-512.png"
            alt="Paws in Stride"
        >

        <div
            class="app-launcher-spinner"
            aria-hidden="true"
        ></div>

        <p
            id="app-launcher-status"
            class="app-launcher-status"
        >
            Opening Paws in Stride...
        </p>

    </main>


    <!-- ========================================
         SUPABASE
    ======================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- ========================================
         SMART PORTAL ENTRY ROUTE
    ======================================== -->

    <script>

        const SUPABASE_URL =
            "https://xyhndwopvlmnxjkthtkl.supabase.co";


        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_U3OIYatZuBUe8Y6Vq0DS2w_IMacau2j";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY,
                {
                    auth: {

                        persistSession:
                            true,

                        autoRefreshToken:
                            true,

                        detectSessionInUrl:
                            true,

                        storage:
                            window.localStorage

                    }
                }
            );


        // ========================================
        // UPDATE LAUNCH STATUS
        // ========================================

        function setLaunchStatus(
            message
        ) {

            const status =
                document.getElementById(
                    "app-launcher-status"
                );


            if (status) {

                status.textContent =
                    message;

            }

        }


        // ========================================
        // SEND USER TO LOGIN
        // ========================================

        function goToLogin() {

            window.location.replace(
                "/portal/login.html"
            );

        }


        // ========================================
        // ROUTE AUTHENTICATED USER
        // ========================================

        async function routeAuthenticatedUser(
            user
        ) {

            if (!user?.id) {

                goToLogin();

                return;

            }


            setLaunchStatus(
                "Loading your portal..."
            );


            const {
                data: profile,
                error
            } =
                await supabaseClient
                    .from(
                        "profiles"
                    )
                    .select(
                        "role"
                    )
                    .eq(
                        "id",
                        user.id
                    )
                    .single();


            if (error) {

                console.error(
                    "PWA profile routing error:",
                    error
                );


                goToLogin();

                return;

            }


            // ========================================
            // ADMIN
            // ========================================

            if (
                profile?.role ===
                "admin"
            ) {

                window.location.replace(
                    "/portal/admin.html"
                );

                return;

            }


            // ========================================
            // CLIENT
            // ========================================

            if (
                profile?.role ===
                "client"
            ) {

                window.location.replace(
                    "/portal/dashboard.html"
                );

                return;

            }


            // ========================================
            // UNKNOWN ROLE
            // ========================================

            console.warn(
                "Unknown portal role:",
                profile?.role
            );


            goToLogin();

        }


        // ========================================
        // LAUNCH PAWS IN STRIDE
        // ========================================

        async function launchPawsInStride() {

            try {

                setLaunchStatus(
                    "Checking your session..."
                );


                const {
                    data,
                    error
                } =
                    await supabaseClient
                        .auth
                        .getSession();


                if (error) {

                    console.error(
                        "PWA session check error:",
                        error
                    );


                    goToLogin();

                    return;

                }


                const session =
                    data?.session;


                // ========================================
                // NO ACTIVE SESSION
                // ========================================

                if (
                    !session?.user
                ) {

                    goToLogin();

                    return;

                }


                // ========================================
                // ACTIVE SESSION
                // ========================================

                await routeAuthenticatedUser(
                    session.user
                );

            }
            catch (error) {

                console.error(
                    "PWA launcher error:",
                    error
                );


                goToLogin();

            }

        }


        launchPawsInStride();

    </script>

</body>

</html>
